name: Portfolio gallery regression

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed LocalPro URL to verify (read-only)
        required: true
        default: https://localpro.lt
        type: string

permissions:
  contents: read

jobs:
  gallery:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify all photos, layout, navigation and closing
        run: npx playwright test --config=playwright.gallery.config.ts --workers=3
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-results
          path: test-results/
          retention-days: 14
